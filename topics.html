<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="topics.css" />
  </head>
  
  <body>
    <div class="header-head">
      <a class="main-logo" href="index.html"><h3>Web Topics</h3></a>
      <button
        class="dark-mode-button"
        onclick="document.body.classList.toggle('darkmode')"
      >
        <span class="moon-icon"><ion-icon name="moon-outline"></ion-icon></span>
        Dark Mode
      </button>

      <button class="favourites-button">
        <span class="favourites-icon"
          ><ion-icon name="heart-outline"></ion-icon
        ></span>
        Favourites
      </button>
    </div>

    <section class="triangle-container">
      <div class="triangle-a"></div>
      <div class="triangle-b"></div>

      <div class="container">
        <h3 class="welcome-tag">Welcome to our website!</h3>
        <h4 class="welcome-tag-sub">We have a new design that's fresh ,modern, and easy to use.</h4>
      </div>
    </section>

    <div class="main-frame" , id="main-frame"></div>

    <script src="topics.js" defer></script>
    <footer>
      <p>Copyright and stuff</p>
    </footer>

    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>
  </body>
</html>
